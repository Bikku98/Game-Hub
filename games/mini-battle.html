<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Battle</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:
        radial-gradient(circle at top,#263b78,#080b18 60%);
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.game{
    width:850px;
    max-width:95%;
    text-align:center;
}

h1{
    font-size:42px;
    margin-bottom:10px;
    text-shadow:0 0 20px #00eaff;
}

.info{
    display:flex;
    justify-content:space-between;
    margin:15px 30px;
    font-size:20px;
}

.health{
    width:250px;
    height:22px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
    margin-top:5px;
}

.bar{
    height:100%;
    width:100%;
    background:#00ff88;
    transition:.2s;
}

#enemyBar{
    background:#ff315c;
}

.arena{
    position:relative;
    height:450px;
    background:
        linear-gradient(#121a35,#090d1b);
    border:3px solid #00eaff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 30px #00eaff55;
}

.player,
.enemy{
    position:absolute;
    width:55px;
    height:55px;
    border-radius:12px;
}

.player{
    background:#00eaff;
    left:70px;
    bottom:40px;
    box-shadow:0 0 20px #00eaff;
}

.enemy{
    background:#ff315c;
    right:70px;
    bottom:40px;
    box-shadow:0 0 20px #ff315c;
}

.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:30px;
    background:#151d3b;
}

.controls{
    margin-top:15px;
    font-size:17px;
    color:#cbd5ff;
}

button{
    margin-top:18px;
    padding:12px 25px;
    border:none;
    border-radius:12px;
    background:#00eaff;
    color:#061018;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

.back{
    background:#252d4a;
    color:white;
    margin-left:8px;
}
</style>
</head>

<body>

<div class="game">

<h1>⚔️ MINI BATTLE</h1>

<div class="info">

<div>
    🧑 PLAYER
    <div class="health">
        <div id="playerBar" class="bar"></div>
    </div>
</div>

<div>
    🤖 ENEMY
    <div class="health">
        <div id="enemyBar" class="bar"></div>
    </div>
</div>

</div>

<div class="arena" id="arena">

<div id="player" class="player"></div>
<div id="enemy" class="enemy"></div>

<div class="ground"></div>

</div>

<div class="controls">
    ⬅️ ➡️ Move &nbsp; | &nbsp; SPACE = Attack
</div>

<button onclick="restart()">🔄 Restart</button>

<button class="back"
onclick="location.href='../index.html'">
🏠 Back to Lobby
</button>

</div>

<script>

const player=document.getElementById("player");
const enemy=document.getElementById("enemy");

const playerBar=document.getElementById("playerBar");
const enemyBar=document.getElementById("enemyBar");

let playerX=70;
let enemyX=720;

let playerHealth=100;
let enemyHealth=100;

let keys={};

document.addEventListener("keydown",e=>{
    keys[e.key]=true;

    if(e.code==="Space"){
        attack();
    }
});

document.addEventListener("keyup",e=>{
    keys[e.key]=false;
});

function gameLoop(){

    if(keys["ArrowLeft"]){
        playerX-=6;
    }

    if(keys["ArrowRight"]){
        playerX+=6;
    }

    playerX=Math.max(10,Math.min(785,playerX));

    player.style.left=playerX+"px";

    enemyAI();

    requestAnimationFrame(gameLoop);
}

function enemyAI(){

    if(enemyX>playerX+80){
        enemyX-=1.5;
    }
    else if(enemyX<playerX-80){
        enemyX+=1.5;
    }

    enemy.style.left=enemyX+"px";

    if(Math.abs(enemyX-playerX)<75){

        if(Math.random()<0.015){
            playerHealth-=5;

            updateHealth();

            if(playerHealth<=0){
                endGame("💀 YOU LOST!");
            }
        }
    }
}

function attack(){

    if(Math.abs(enemyX-playerX)<120){

        enemyHealth-=10;

        updateHealth();

        if(enemyHealth<=0){
            endGame("🏆 YOU WIN!");
        }
    }
}

function updateHealth(){

    playerBar.style.width=playerHealth+"%";
    enemyBar.style.width=enemyHealth+"%";
}

function endGame(message){

    setTimeout(()=>{
        alert(message);
    },50);
}

function restart(){

    playerHealth=100;
    enemyHealth=100;

    playerX=70;
    enemyX=720;

    updateHealth();

    player.style.left=playerX+"px";
    enemy.style.left=enemyX+"px";
}

gameLoop();

</script>

</body>
</html>
