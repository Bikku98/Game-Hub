<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2 Player Battle</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    color:white;

    background:
        radial-gradient(circle at top,#31216b,#070914 65%);
}

.game{
    width:900px;
    max-width:95%;

    text-align:center;
}

h1{
    font-size:42px;

    margin-bottom:10px;

    text-shadow:
        0 0 15px #00eaff,
        0 0 30px #ff315c;
}


/* SCORE */

.scoreboard{
    display:flex;

    justify-content:space-between;

    gap:20px;

    margin:15px 20px;
}

.player-info{
    width:45%;

    font-size:20px;
    font-weight:bold;
}

.health{
    height:22px;

    margin-top:7px;

    background:#20243b;

    border-radius:20px;

    overflow:hidden;
}

.health-bar{
    width:100%;
    height:100%;

    transition:.2s;
}

#p1Health{
    background:#00eaff;

    box-shadow:
        0 0 15px #00eaff;
}

#p2Health{
    background:#ff315c;

    box-shadow:
        0 0 15px #ff315c;
}


/* ARENA */

.arena{
    position:relative;

    width:100%;
    height:500px;

    overflow:hidden;

    border:3px solid #ffffff;

    border-radius:20px;

    background:

        linear-gradient(
            #10152e,
            #080b19
        );

    box-shadow:
        0 0 35px #8b5cff55;
}


/* Ground */

.ground{
    position:absolute;

    bottom:0;

    width:100%;
    height:35px;

    background:#1b2340;

    border-top:2px solid #39466e;
}


/* Player */

.fighter{

    position:absolute;

    width:60px;
    height:80px;

    bottom:35px;

    border-radius:15px;

    transition:
        left .08s,
        transform .08s;
}

#player1{

    left:80px;

    background:#00eaff;

    box-shadow:
        0 0 20px #00eaff,
        0 0 40px #00eaff55;
}

#player2{

    right:80px;

    background:#ff315c;

    box-shadow:
        0 0 20px #ff315c,
        0 0 40px #ff315c55;
}


/* Heads */

.fighter::before{

    content:"";

    position:absolute;

    width:35px;
    height:35px;

    border-radius:50%;

    background:#f5cfa5;

    top:-25px;

    left:12px;
}


/* Attack */

.attack{

    animation:
        attackAnim .18s;
}

@keyframes attackAnim{

    50%{
        transform:
            scale(1.2)
            rotate(-8deg);
    }

}


/* Hit effect */

.hit{

    animation:
        hitAnim .15s;
}

@keyframes hitAnim{

    50%{
        filter:
            brightness(3);

        transform:
            translateX(10px);
    }

}


/* Controls */

.controls{

    display:flex;

    justify-content:space-between;

    gap:20px;

    margin-top:15px;
}

.control-box{

    width:50%;

    padding:12px;

    border-radius:15px;

    background:#111731;

    border:1px solid #ffffff22;
}

.p1{
    border-color:#00eaff88;
}

.p2{
    border-color:#ff315c88;
}

.control-box h3{
    margin-bottom:6px;
}

.control-box p{
    color:#cbd5ff;
    font-size:15px;
}


/* Message */

.message{

    min-height:35px;

    margin-top:12px;

    font-size:22px;

    font-weight:bold;
}


/* Buttons */

button{

    margin-top:15px;

    padding:12px 25px;

    border:none;

    border-radius:12px;

    background:#00eaff;

    color:#061018;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

button:hover{

    transform:scale(1.06);
}

.back{

    background:#252d4a;

    color:white;

    margin-left:8px;
}


@media(max-width:600px){

    h1{
        font-size:30px;
    }

    .arena{
        height:400px;
    }

    .controls{
        flex-direction:column;
    }

    .control-box{
        width:100%;
    }

}

</style>

</head>


<body>


<div class="game">

<h1>⚔️ 2 PLAYER BATTLE</h1>


<!-- SCORE -->

<div class="scoreboard">

    <div class="player-info">

        🔵 PLAYER 1

        <div class="health">

            <div
                id="p1Health"
                class="health-bar">
            </div>

        </div>

    </div>


    <div class="player-info">

        🔴 PLAYER 2

        <div class="health">

            <div
                id="p2Health"
                class="health-bar">
            </div>

        </div>

    </div>

</div>


<!-- ARENA -->

<div id="arena" class="arena">


    <div
        id="player1"
        class="fighter">
    </div>


    <div
        id="player2"
        class="fighter">
    </div>


    <div class="ground"></div>


</div>


<!-- CONTROLS -->

<div class="controls">


    <div class="control-box p1">

        <h3>🔵 PLAYER 1</h3>

        <p>
            W = Jump<br>
            A = Left<br>
            D = Right<br>
            F = Attack
        </p>

    </div>


    <div class="control-box p2">

        <h3>🔴 PLAYER 2</h3>

        <p>
            ↑ = Jump<br>
            ← = Left<br>
            → = Right<br>
            ENTER = Attack
        </p>

    </div>


</div>


<div
    id="message"
    class="message">

    ⚔️ FIGHT!

</div>


<button onclick="restart()">
    🔄 Restart
</button>


<button
    class="back"
    onclick="location.href='../index.html'">

    🏠 Back to Lobby

</button>


</div>


<script>


const player1=
    document.getElementById("player1");

const player2=
    document.getElementById("player2");


const p1HealthBar=
    document.getElementById("p1Health");

const p2HealthBar=
    document.getElementById("p2Health");

const message=
    document.getElementById("message");


/* Positions */

let p1X=80;
let p2X=720;


/* Vertical */

let p1Y=0;
let p2Y=0;


/* Health */

let p1Health=100;
let p2Health=100;


/* Keys */

let keys={};


/* Game */

let gameOver=false;


/* Keyboard down */

document.addEventListener(
    "keydown",
    function(e){

        if(gameOver) return;

        keys[e.key.toLowerCase()]=true;


        /* Player 1 attack */

        if(e.key.toLowerCase()==="f"){

            attackPlayer1();

        }


        /* Player 2 attack */

        if(e.key==="Enter"){

            attackPlayer2();

        }

    }
);


/* Keyboard up */

document.addEventListener(
    "keyup",
    function(e){

        keys[e.key.toLowerCase()]=false;

    }
);


/* Game loop */

function gameLoop(){

    if(!gameOver){

        movePlayers();

        updatePlayers();

    }

    requestAnimationFrame(gameLoop);

}


/* Movement */

function movePlayers(){


    /* PLAYER 1 */

    if(keys["a"]){

        p1X-=5;

    }

    if(keys["d"]){

        p1X+=5;

    }


    /* PLAYER 2 */

    if(keys["arrowleft"]){

        p2X-=5;

    }

    if(keys["arrowright"]){

        p2X+=5;

    }


    /* Boundaries */

    p1X=
        Math.max(
            10,
            Math.min(810,p1X)
        );


    p2X=
        Math.max(
            10,
            Math.min(810,p2X)
        );


    /* Jump */

    if(keys["w"] && p1Y===0){

        jump(1);

    }


    if(keys["arrowup"] && p2Y===0){

        jump(2);

    }

}


/* Update */

function updatePlayers(){

    player1.style.left=
        p1X+"px";

    player2.style.left=
        p2X+"px";


    player1.style.bottom=
        (35+p1Y)+"px";

    player2.style.bottom=
        (35+p2Y)+"px";

}


/* Jump */

function jump(player){

    let y=0;

    const fighter=
        player===1
        ? player1
        : player2;


    const jumpTimer=
        setInterval(()=>{

            y+=7;

            if(y>=100){

                clearInterval(jumpTimer);

                const fall=
                    setInterval(()=>{

                        y-=7;

                        if(y<=0){

                            y=0;

                            clearInterval(fall);

                        }

                        if(player===1){

                            p1Y=y;

                        }else{

                            p2Y=y;

                        }

                    },30);

            }


            if(player===1){

                p1Y=y;

            }else{

                p2Y=y;

            }

        },30);

}


/* Player 1 attack */

function attackPlayer1(){

    if(gameOver) return;


    player1.classList.add("attack");

    setTimeout(()=>{

        player1.classList.remove("attack");

    },200);


    const distance=
        Math.abs(p1X-p2X);


    if(distance<110){

        p2Health-=10;

        player2.classList.add("hit");

        setTimeout(()=>{

            player2.classList.remove("hit");

        },180);

        updateHealth();

        checkWinner();

    }

}


/* Player 2 attack */

function attackPlayer2(){

    if(gameOver) return;


    player2.classList.add("attack");

    setTimeout(()=>{

        player2.classList.remove("attack");

    },200);


    const distance=
        Math.abs(p1X-p2X);


    if(distance<110){

        p1Health-=10;

        player1.classList.add("hit");

        setTimeout(()=>{

            player1.classList.remove("hit");

        },180);

        updateHealth();

        checkWinner();

    }

}


/* Health */

function updateHealth(){

    p1HealthBar.style.width=
        Math.max(0,p1Health)+"%";

    p2HealthBar.style.width=
        Math.max(0,p2Health)+"%";

}


/* Winner */

function checkWinner(){

    if(p1Health<=0){

        gameOver=true;

        message.textContent=
            "🔴 PLAYER 2 WINS! 🏆";

        message.style.color=
            "#ff315c";

    }


    if(p2Health<=0){

        gameOver=true;

        message.textContent=
            "🔵 PLAYER 1 WINS! 🏆";

        message.style.color=
            "#00eaff";

    }

}


/* Restart */

function restart(){

    p1X=80;
    p2X=720;

    p1Y=0;
    p2Y=0;

    p1Health=100;
    p2Health=100;

    gameOver=false;

    updateHealth();

    updatePlayers();

    message.textContent=
        "⚔️ FIGHT!";

    message.style.color=
        "white";

}


updateHealth();

gameLoop();

</script>

</body>
</html>
