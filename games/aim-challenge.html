<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Aim Challenge</title>

<style>

body{
    margin:0;
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    color:#ef4444;
}

#game{

    width:700px;
    max-width:95%;

    height:500px;

    margin:auto;

    position:relative;

    overflow:hidden;

    background:#111827;

    border:4px solid #ef4444;

}

.target{

    position:absolute;

    width:55px;
    height:55px;

    background:#ef4444;

    border-radius:50%;

    cursor:pointer;

}

button{

    margin-top:15px;

    padding:12px 25px;

    border:0;

    border-radius:20px;

    background:#ef4444;

    color:white;

    font-weight:bold;

}

</style>

</head>

<body>

<h1>🎯 AIM CHALLENGE</h1>

<p id="score">
Score: 0 | Time: 30
</p>

<div id="game"></div>

<button onclick="location.href='../index.html'">
🏠 BACK
</button>

<script>

const game=
document.getElementById("game");

let score=0;
let time=30;

function createTarget(){

    document
    .querySelectorAll(".target")
    .forEach(
        t=>t.remove()
    );

    const target=
        document.createElement("div");

    target.className="target";

    target.style.left=
        Math.random()*640+"px";

    target.style.top=
        Math.random()*440+"px";

    target.onclick=function(){

        score++;

        updateText();

        createTarget();

    };

    game.appendChild(target);

}


function updateText(){

    document.getElementById(
        "score"
    ).innerText=
        "Score: "+score+
        " | Time: "+time;

}


createTarget();


const timer=setInterval(function(){

    time--;

    updateText();

    if(time<=0){

        clearInterval(timer);

        document
        .querySelectorAll(".target")
        .forEach(
            t=>t.remove()
        );

        alert(
            "🎯 TIME UP!\nScore: "+score
        );

    }

},1000);

</script>

</body>
</html>
