<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Penalty Kick</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    color:white;

    background:
        radial-gradient(circle at top,#155e75,#06111f 65%);
}

.game{
    width:850px;
    max-width:95%;
    text-align:center;
}

h1{
    font-size:42px;
    margin-bottom:8px;
    text-shadow:0 0 20px #00eaff;
}

.score{
    display:flex;
    justify-content:center;
    gap:35px;
    font-size:22px;
    margin:15px;
}

.field{
    position:relative;
    width:100%;
    height:500px;

    border:3px solid white;
    border-radius:20px;

    overflow:hidden;

    background:
        repeating-linear-gradient(
            90deg,
            #087f45 0px,
            #087f45 80px,
            #096f3e 80px,
            #096f3e 160px
        );

    box-shadow:
        0 0 30px #00ff8844;
}

/* Goal */

.goal{
    position:absolute;
    top:30px;
    left:50%;
    transform:translateX(-50%);

    width:400px;
    height:170px;

    border:8px solid white;
    border-bottom:none;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 35px,
            #ffffff33 36px,
            #ffffff33 38px
        );
}

/* Goal keeper */

.keeper{
    position:absolute;

    top:105px;
    left:50%;

    transform:translateX(-50%);

    width:55px;
    height:75px;

    background:#ff315c;

    border-radius:25px 25px 10px 10px;

    box-shadow:0 0 20px #ff315c;
}

/* Ball */

.ball{
    position:absolute;

    width:32px;
    height:32px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 10px white;

    bottom:55px;
    left:50%;

    transform:translateX(-50%);

    cursor:pointer;

    transition:
        left .45s,
        bottom .45s,
        transform .45s;
}

/* Aim buttons */

.controls{
    margin-top:15px;

    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

button{
    padding:12px 25px;

    border:none;
    border-radius:12px;

    font-weight:bold;

    cursor:pointer;

    background:#00eaff;
    color:#061018;

    transition:.2s;
}

button:hover{
    transform:scale(1.06);
}

.back{
    background:#252d4a;
    color:white;
}

.message{
    margin-top:12px;
    min-height:25px;

    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="game">

<h1>⚽ PENALTY KICK</h1>

<div class="score">
    <div>GOALS: <span id="goals">0</span></div>
    <div>KICKS: <span id="kicks">0</span>/5</div>
</div>

<div class="field">

    <div class="goal"></div>

    <div id="keeper" class="keeper"></div>

    <div id="ball" class="ball"></div>

</div>

<div class="controls">

    <button onclick="shoot('left')">
        ⬅️ LEFT
    </button>

    <button onclick="shoot('center')">
        ⬆️ CENTER
    </button>

    <button onclick="shoot('right')">
        RIGHT ➡️
    </button>

</div>

<div id="message" class="message">
    Choose where to shoot!
</div>

<button onclick="restart()">
    🔄 Restart
</button>

<button class="back"
onclick="location.href='../index.html'">
    🏠 Back to Lobby
</button>

</div>

<script>

const ball=document.getElementById("ball");
const keeper=document.getElementById("keeper");

const goalsText=document.getElementById("goals");
const kicksText=document.getElementById("kicks");
const message=document.getElementById("message");

let goals=0;
let kicks=0;

let locked=false;

function shoot(direction){

    if(locked || kicks>=5){
        return;
    }

    locked=true;
    kicks++;

    kicksText.textContent=kicks;

    /* Keeper chooses random direction */

    const keeperDirections=[
        "left",
        "center",
        "right"
    ];

    const keeperDirection=
        keeperDirections[
            Math.floor(
                Math.random()*keeperDirections.length
            )
        ];

    /* Move keeper */

    if(keeperDirection==="left"){
        keeper.style.left="38%";
    }

    if(keeperDirection==="center"){
        keeper.style.left="50%";
    }

    if(keeperDirection==="right"){
        keeper.style.left="62%";
    }

    /* Shoot ball */

    if(direction==="left"){
        ball.style.left="35%";
        ball.style.bottom="330px";
        ball.style.transform="translateX(-50%) scale(.6)";
    }

    if(direction==="center"){
        ball.style.left="50%";
        ball.style.bottom="350px";
        ball.style.transform="translateX(-50%) scale(.6)";
    }

    if(direction==="right"){
        ball.style.left="65%";
        ball.style.bottom="330px";
        ball.style.transform="translateX(-50%) scale(.6)";
    }

    setTimeout(()=>{

        if(direction===keeperDirection){

            message.textContent="🧤 SAVED!";

            message.style.color="#ff315c";

        }else{

            goals++;

            goalsText.textContent=goals;

            message.textContent="⚽ GOOOOAL! 🔥";

            message.style.color="#00ff88";
        }

    },450);

    setTimeout(()=>{

        resetBall();

        if(kicks>=5){

            setTimeout(()=>{

                if(goals>=3){

                    message.textContent=
                        "🏆 AMAZING! YOU WIN!";

                }else{

                    message.textContent=
                        "😢 GAME OVER! Try Again!";
                }

            },300);

        }else{

            locked=false;

            message.textContent=
                "Choose your next shot!";

        }

    },1000);
}

function resetBall(){

    ball.style.left="50%";
    ball.style.bottom="55px";

    ball.style.transform=
        "translateX(-50%) scale(1)";

    keeper.style.left="50%";
}

function restart(){

    goals=0;
    kicks=0;
    locked=false;

    goalsText.textContent="0";
    kicksText.textContent="0";

    message.textContent=
        "Choose where to shoot!";

    message.style.color="white";

    resetBall();
}

</script>

</body>
</html>
