<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Space Shooter</title>

<style>

body{

    margin:0;

    background:#020617;

    color:white;

    font-family:Arial;

    text-align:center;
}

h1{
    color:#a855f7;
}

#game{

    width:500px;

    max-width:95%;

    height:600px;

    margin:auto;

    position:relative;

    overflow:hidden;

    background:

        radial-gradient(
            white 1px,
            transparent 1px
        );

    background-size:
        40px 40px;

    background-color:#020617;

    border:4px solid #a855f7;
}

#player{

    position:absolute;

    width:45px;

    height:45px;

    background:#22d3ee;

    bottom:20px;

    left:225px;

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            50% 75%,
            0 100%
        );
}

.enemy{

    position:absolute;

    width:40px;

    height:40px;

    background:#ef4444;

    border-radius:50%;
}

.bullet{

    position:absolute;

    width:6px;

    height:18px;

    background:#facc15;

}

button{

    margin-top:15px;

    padding:12px 25px;

    border:0;

    border-radius:20px;

    background:#a855f7;

    color:white;

    font-weight:bold;
}

</style>

</head>

<body>

<h1>🚀 SPACE SHOOTER</h1>

<p id="score">Score: 0</p>

<div id="game">

<div id="player"></div>

</div>

<button onclick="location.href='../index.html'">
🏠 BACK
</button>

<script>

const game=
document.getElementById("game");

const player=
document.getElementById("player");

let px=225;

let score=0;

document.addEventListener(
"keydown",
function(e){

    if(e.key==="ArrowLeft")
        px-=20;

    if(e.key==="ArrowRight")
        px+=20;

    if(e.code==="Space")
        shoot();

    px=Math.max(
        0,
        Math.min(
            455,
            px
        )
    );

    player.style.left=
        px+"px";

});


function shoot(){

    const bullet=
    document.createElement("div");

    bullet.className="bullet";

    let bx=px+20;
    let by=540;

    bullet.style.left=
        bx+"px";

    bullet.style.top=
        by+"px";

    game.appendChild(bullet);

    let timer=setInterval(
    function(){

        by-=10;

        bullet.style.top=
            by+"px";

        document
        .querySelectorAll(".enemy")
        .forEach(
        function(enemy){

            let ex=
                parseInt(
                    enemy.style.left
                );

            let ey=
                parseInt(
                    enemy.style.top
                );

            if(
                bx<ex+40 &&
                bx+6>ex &&
                by<ey+40 &&
                by+18>ey
            ){

                enemy.remove();

                bullet.remove();

                score++;

                document.getElementById(
                    "score"
                ).innerText=
                    "Score: "+score;

            }

        });

        if(by<0){

            clearInterval(timer);

            bullet.remove();

        }

    },20);

}


function createEnemy(){

    const enemy=
    document.createElement("div");

    enemy.className="enemy";

    let ex=
        Math.random()*460;

    let ey=-50;

    enemy.style.left=
        ex+"px";

    enemy.style.top=
        ey+"px";

    game.appendChild(enemy);

    let timer=setInterval(
    function(){

        ey+=3;

        enemy.style.top=
            ey+"px";

        if(ey>600){

            clearInterval(timer);

            enemy.remove();

        }

        if(
            ey>530 &&
            ex>px-40 &&
            ex<px+40
        ){

            alert(
                "💥 SPACE SHIP DESTROYED!\nScore: "
                +score
            );

            location.reload();

        }

    },30);

}

setInterval(
createEnemy,
900
);

</script>

</body>

</html>
