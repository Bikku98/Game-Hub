<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Ping Pong</title>

<style>

body{
    margin:0;
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    color:#22d3ee;
}

canvas{

    background:#064e3b;

    border:4px solid #22d3ee;

    max-width:95%;

}

button{

    margin-top:15px;

    padding:12px 25px;

    border:0;

    border-radius:20px;

    background:#22d3ee;

    font-weight:bold;

}

</style>

</head>

<body>

<h1>🏓 PING PONG</h1>

<p>⬆️ ⬇️ = Move</p>

<canvas
id="game"
width="700"
height="400">
</canvas>

<br>

<button onclick="location.href='../index.html'">
🏠 BACK
</button>

<script>

const canvas=
document.getElementById("game");

const ctx=
canvas.getContext("2d");

let playerY=160;
let aiY=160;

let ballX=350;
let ballY=200;

let ballDX=5;
let ballDY=3;

let score=0;


document.addEventListener(
"keydown",
function(e){

    if(e.key==="ArrowUp")
        playerY-=25;

    if(e.key==="ArrowDown")
        playerY+=25;

    playerY=Math.max(
        0,
        Math.min(
            320,
            playerY
        )
    );

});


function draw(){

    ctx.clearRect(
        0,
        0,
        700,
        400
    );

    // Middle line

    ctx.setLineDash([10,10]);

    ctx.strokeStyle="white";

    ctx.beginPath();

    ctx.moveTo(350,0);
    ctx.lineTo(350,400);

    ctx.stroke();

    ctx.setLineDash([]);

    // Player

    ctx.fillStyle="#22d3ee";

    ctx.fillRect(
        20,
        playerY,
        15,
        80
    );

    // AI

    ctx.fillStyle="#f43f5e";

    ctx.fillRect(
        665,
        aiY,
        15,
        80
    );

    // Ball

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        ballX,
        ballY,
        10,
        0,
        Math.PI*2
    );

    ctx.fill();

}


function update(){

    ballX+=ballDX;
    ballY+=ballDY;

    if(
        ballY<10 ||
        ballY>390
    ){

        ballDY=-ballDY;

    }

    // AI

    if(aiY+40<ballY)
        aiY+=3;

    if(aiY+40>ballY)
        aiY-=3;

    // Player collision

    if(
        ballX<40 &&
        ballY>playerY &&
        ballY<playerY+80
    ){

        ballDX=
            Math.abs(ballDX);

    }

    // AI collision

    if(
        ballX>650 &&
        ballY>aiY &&
        ballY<aiY+80
    ){

        ballDX=
            -Math.abs(ballDX);

    }

    // AI scores

    if(ballX<0){

        alert(
            "😵 GAME OVER!\nScore: "+score
        );

        location.reload();

    }

    // Player scores

    if(ballX>700){

        score++;

        ballX=350;
        ballY=200;

        ballDX=-5;

    }

}


function loop(){

    update();
    draw();

    requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
