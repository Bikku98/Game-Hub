<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Racer</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    color:#22d3ee;
}

#game{
    position:relative;
    width:360px;
    height:600px;
    margin:auto;
    overflow:hidden;

    background:
        linear-gradient(
            90deg,
            #111 0 25%,
            #333 25% 75%,
            #111 75%
        );

    border:4px solid #22d3ee;
}

.road-line{
    position:absolute;
    width:8px;
    height:80px;
    background:white;
    left:176px;
}

.car{
    position:absolute;
    width:50px;
    height:80px;
    bottom:30px;
    left:155px;

    background:#ef4444;
    border-radius:10px;
}

.enemy{
    position:absolute;
    width:50px;
    height:80px;
    background:#facc15;
    border-radius:10px;
}

#score{
    font-size:20px;
}

button{
    margin-top:15px;
    padding:12px 25px;
    border:0;
    border-radius:20px;
    background:#22d3ee;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>🏎️ SPEED RACER</h1>

<p id="score">Score: 0</p>

<div id="game">

    <div class="car" id="car"></div>

</div>

<button onclick="location.href='../index.html'">
🏠 BACK
</button>

<script>

const game = document.getElementById("game");
const car = document.getElementById("car");
const scoreText = document.getElementById("score");

let carX = 155;
let score = 0;
let speed = 5;

let enemy = {
    x:155,
    y:-100
};

document.addEventListener("keydown",function(e){

    if(e.key==="ArrowLeft"){
        carX -= 25;
    }

    if(e.key==="ArrowRight"){
        carX += 25;
    }

    if(carX < 10){
        carX = 10;
    }

    if(carX > 300){
        carX = 300;
    }

    car.style.left = carX+"px";

});

function gameLoop(){

    enemy.y += speed;

    if(enemy.y > 650){

        enemy.y = -100;

        enemy.x =
            Math.floor(
                Math.random()*6
            )*50 + 30;

        score++;

        scoreText.innerText =
            "Score: "+score;

        if(score % 5 === 0){
            speed++;
        }
    }

    let enemyElement =
        document.querySelector(".enemy");

    if(!enemyElement){

        enemyElement =
            document.createElement("div");

        enemyElement.className="enemy";

        game.appendChild(enemyElement);
    }

    enemyElement.style.left =
        enemy.x+"px";

    enemyElement.style.top =
        enemy.y+"px";

    if(
        enemy.y+80 > 490 &&
        enemy.y < 560 &&
        enemy.x < carX+50 &&
        enemy.x+50 > carX
    ){

        alert(
            "💥 GAME OVER!\nScore: "+score
        );

        location.reload();
    }

}

setInterval(gameLoop,30);

</script>

</body>
</html>
